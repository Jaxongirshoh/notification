spring:
  application:
    name: notification

  jpa:
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: notification
    password: 1234
    driver-class-name: org.postgresql.Driver
